version: "3.8"

services:
  focalboardsx:
    image: ghcr.io/eduardoazm/focalboardsx:latest
    container_name: focalboardsx
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - VIRTUAL_HOST=localhost
      - VIRTUAL_PORT=8000
    volumes:
      - focalboard_data:/opt/focalboard/data

volumes:
  focalboard_data:
    driver: local
